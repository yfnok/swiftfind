[package]
name = "swiftfind"
version = "0.1.0"
edition = "2021"
description = "Fast Windows launcher built on Everything: self-learning ranking, Windows settings search, custom commands"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
# Pure-Rust embedded database for the clipboard history (no C compiler needed).
redb = "5"
# PNG encode/decode for clipboard images.
png = "0.18"

# Linux-only: lets us type-check and unit-test the whole crate off-Windows.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# unwind (not abort): a panic in a worker thread is logged and survived instead of killing the app
panic = "unwind"
strip = true

[build-dependencies]
